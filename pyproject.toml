[project]
name = "ml"
version = "0.1.0"
description = "Phishing Website URL Detection Using Machine Learning"
readme = "README.md"
authors = [
    { name = "jsfl", email = "jasfal2004@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "streamlit",
    "huggingface_hub",
    "fsspec",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
